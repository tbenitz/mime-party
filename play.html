<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mime Party — Charades & Pictionary</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Figtree:wght@420;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/mqtt@5.10.3/dist/mqtt.min.js"></script>
<style>
  :root { --bg:#0c0b10; --elev:#16141c; --line:rgba(255,255,255,.08); --paper:#f4efe6; --ink:#1a1714; --muted:#a39bb0; --gold:#e4b15a; --crimson:#e23d4a; --teal:#3dbeb6; --a:#e25b6a; --b:#5aa7e4; --ok:#7dcea0; }
  * { box-sizing:border-box; } html,body { margin:0; background:var(--bg); color:var(--paper); font-family:Figtree,sans-serif; }
  button,input,select { font-family:inherit; } button { cursor:pointer; } h1,h2 { font-family:Fraunces,serif; margin:0; }
  header.top { display:flex; justify-content:space-between; align-items:center; padding:14px 22px; border-bottom:1px solid var(--line); }
  .brand { display:flex; gap:10px; align-items:center; } .mark { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; background:conic-gradient(from 120deg,var(--crimson),var(--gold),var(--teal),var(--crimson)); color:#111; font-family:Fraunces,serif; }
  .brand small { display:block; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; font-size:10px; }
  main { max-width:1180px; margin:0 auto; padding:22px; }
  .gate { display:grid; grid-template-columns:1.1fr .9fr; gap:28px; align-items:center; min-height:70vh; }
  .hero h1 { font-size:clamp(42px,6vw,72px); line-height:.92; }
  .lede { color:var(--muted); font-size:18px; max-width:520px; }
  .card { background:var(--elev); border:1px solid var(--line); border-radius:18px; padding:18px; }
  label { display:block; color:var(--muted); font-size:12px; letter-spacing:.06em; text-transform:uppercase; margin:10px 0 6px; }
  input,select { width:100%; background:#0c0b10; color:var(--paper); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .btn { border:0; border-radius:12px; padding:11px 14px; font-weight:650; background:var(--paper); color:var(--ink); }
  .btn.gold { background:var(--gold); } .btn.ghost { background:transparent; color:var(--paper); border:1px solid var(--line); }
  .btn.danger { background:var(--crimson); color:#fff; } .btn.teal { background:var(--teal); color:#08211f; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .layout { display:grid; grid-template-columns:260px 1fr 290px; gap:14px; }
  .team { background:var(--elev); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:10px; }
  .team.A { box-shadow:inset 3px 0 0 var(--a); } .team.B { box-shadow:inset 3px 0 0 var(--b); }
  .team header { display:flex; justify-content:space-between; } .score { font-family:Fraunces,serif; font-size:32px; }
  .player { display:flex; justify-content:space-between; border-top:1px solid var(--line); padding:6px 0; font-size:14px; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:#665; margin-right:6px; } .dot.on { background:var(--ok); }
  .stage { background:var(--elev); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .stage-bar { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .timer { font-family:Fraunces,serif; font-size:40px; }
  .board { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px; background:#09080d; }
  .board.solo { grid-template-columns:1fr; }
  video,canvas { width:100%; height:340px; background:#111; border-radius:12px; object-fit:cover; }
  canvas { background:#f7f1e6; touch-action:none; }
  .secret { background:var(--paper); color:var(--ink); border-radius:16px; padding:14px; margin-bottom:10px; }
  .secret.hidden { background:#201d28; color:var(--muted); }
  .secret .word { font-family:Fraunces,serif; font-size:28px; }
  .banner { background:#2a2418; color:var(--gold); border-radius:12px; padding:8px 12px; margin-bottom:10px; }
  .modal-back { position:fixed; inset:0; background:rgba(0,0,0,.55); display:grid; place-items:center; z-index:9; }
  .modal { width:min(520px,94vw); background:var(--elev); border:1px solid var(--line); border-radius:18px; padding:18px; }
  .modes button,.tiny { border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--paper); padding:6px 10px; }
  .modes button.on { background:var(--paper); color:var(--ink); }
  footer { color:var(--muted); font-size:12px; padding:8px 22px 18px; }
  @media (max-width:900px) { .gate,.layout,.board { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark">M</div><div><small>Live party</small><strong>Mime Party</strong></div></div><div id="topMeta">4–20 players</div></header>
<main id="root"></main>
<footer>Room traffic uses a public MQTT broker (no game server to host). Refresh this page if a button does nothing.</footer>
<script>
const WORDS = {
  Actions:["tightrope walking","milking a cow","parallel parking","flipping a pancake","conducting an orchestra","changing a diaper","surfing a wave","tying a necktie"],
  Animals:["penguin","octopus","giraffe","sloth","flamingo","hedgehog","kangaroo","chameleon"],
  Movies:["Jaws","The Wizard of Oz","Titanic","Jurassic Park","Star Wars","Frozen","The Matrix","Home Alone"],
  Food:["spaghetti","sushi","popcorn","banana split","tacos","milkshake","watermelon","birthday cake"],
  Places:["library","airport","circus","haunted house","laundromat","campfire","elevator","bowling alley"],
  Objects:["umbrella","telescope","rubber duck","hourglass","trampoline","boomerang","compass","kite"]
};
const BROKERS = ["wss://broker.hivemq.com:8884/mqtt","wss://broker.emqx.io:8084/mqtt"];
const MIN_PLAYERS = 4, MAX_PLAYERS = 20;
const uid = () => crypto.randomUUID();
function saved(k, v){ if (v === undefined) return localStorage.getItem(k)||""; localStorage.setItem(k,v); }
const ME = saved("mp-id") || (saved("mp-id", uid()), saved("mp-id"));
const S = { role:null, room:"", mq:null, state:null, mode:"charades", color:"#1a1714", drawing:false, stroke:null, pcs:{} };
function esc(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&","<":"<",">":">","\"":""","'":"&#39;"}[c])); }
function root(){ return document.getElementById("root"); }
function err(t){ const n=document.getElementById("gateErr"); if(n) n.textContent=t; }
function me(st){ return st && st.players.find(p => p.id===ME); }
function leader(st){ const m=me(st); return m && m.leader; }
function seeWord(st){
  const m=me(st); if(!m||!st.turn) return false;
  if(st.phase==="challenge"||m.leader||m.id===st.turn.actorId) return true;
  return m.team && m.team!==st.turn.team;
}
function render(){
  const meta=document.getElementById("topMeta");
  if(!S.state){ meta.textContent="4–20 players"; root().innerHTML=gateHTML(); bindGate(); return; }
  const st=S.state;
  meta.innerHTML=`Room <strong>${esc(S.room)}</strong> · ${st.players.filter(p=>p.connected).length} live`;
  root().innerHTML=boardHTML(st); bindBoard(); paint();
}
function gateHTML(){
  return `<section class="gate"><div class="hero"><h1>Act it. Draw it. Or both.</h1><p class="lede">Charades, Pictionary, or combo. The other team sees the secret. Challenges go to a vote, then the party leader rules.</p></div>
  <div class="card"><label>Your name</label><input id="name" maxlength="22" value="${esc(saved("mp-name"))}" placeholder="Name the room will see" />
  <div class="row"><div><label>Join code</label><input id="code" maxlength="5" placeholder="ABCDE" style="text-transform:uppercase" value="${esc(saved("mp-room"))}" /></div>
  <div><label>Team</label><select id="team"><option value="">Auto</option><option>A</option><option>B</option></select></div></div>
  <div class="row" style="margin-top:14px"><button class="btn gold" id="create">Create party</button><button class="btn" id="join">Join</button></div>
  <p id="gateErr" style="color:var(--crimson);min-height:1.2em"></p></div></section>`;
}
function boardHTML(st){
  const m=me(st);
  const teams=["A","B"].map(t=>{
    const ps=st.players.filter(p=>p.team===t);
    return `<div class="team ${t}"><header><div><strong>Team ${t}</strong></div><div class="score">${st.scores[t]||0}</div></header>
      ${ps.map(p=>`<div class="player"><div><span class="dot ${p.connected?"on":""}"></span>${esc(p.name)}${p.leader?" · leader":""}${p.id===st.turn?.actorId?" · up":""}</div><span>${p.connected?"in":"away"}</span></div>`).join("")||"<div class='player'>Empty</div>"}</div>`;
  }).join("");
  const see=seeWord(st);
  const showDraw=st.turn&&(st.turn.mode==="pictionary"||st.turn.mode==="combo");
  const showVid=!st.turn||st.turn.mode!=="pictionary";
  const left=st.turn?Math.max(0,Math.ceil((st.turn.endsAt-Date.now())/1000)):"—";
  return `<div class="layout"><div>${st.banner?`<div class="banner">${esc(st.banner)}</div>`:""}${teams}
    <button class="btn ghost" id="leave">Leave</button></div>
    <section class="stage"><div class="stage-bar"><div><strong>${st.phase==="play"?"Team "+st.turn.team+" is up":"Stage"}</strong><div style="color:var(--muted)">${esc(st.link||"")}</div></div><div class="timer" id="timer">${left}</div></div>
    <div class="board ${showDraw&&showVid?"":"solo"}">${showVid?'<video id="stageVideo" autoplay playsinline muted></video>':""}${showDraw?'<canvas id="pad" width="900" height="600"></canvas>':""}</div>
    <div class="stage-bar">${leader(st)&&st.phase==="lobby"?`<div class="modes"><button data-mode="charades" class="${S.mode==="charades"?"on":""}">Charades</button><button data-mode="pictionary" class="${S.mode==="pictionary"?"on":""}">Pictionary</button><button data-mode="combo" class="${S.mode==="combo"?"on":""}">Combo</button></div><button class="btn gold" id="start" ${st.players.filter(p=>p.connected).length<MIN_PLAYERS?"disabled":""}>Start round</button>`:""}
    ${st.phase==="play"&&m&&m.team===st.turn.team&&m.id!==st.turn.actorId?'<input id="guess" placeholder="Type a guess" /><button class="btn" id="sendGuess">Guess</button>':""}
    ${st.phase==="play"&&m&&(m.id===st.turn.actorId||m.leader)?'<button class="btn teal" id="correct">Correct</button><button class="btn ghost" id="skip">Skip</button>':""}
    ${st.phase==="play"?'<button class="btn danger" id="challenge">Challenge</button>':""}
    ${st.phase==="between"&&leader(st)?'<button class="btn gold" id="next">Next turn</button>':""}
    ${showDraw&&m&&st.turn&&m.id===st.turn.actorId?'<button class="tiny" id="clearPad">Clear</button>':""}</div></section>
    <aside><div class="secret ${see?"":"hidden"}"><div class="word">${see?esc(st.turn.word):"••••"}</div><div>${st.turn?esc(st.turn.category)+" · "+esc(st.turn.mode):"Waiting for players"}</div></div>
    <div class="card"><strong>Guesses</strong>${(st.guesses||[]).slice(-8).reverse().map(g=>`<div class="player"><strong>${esc(g.name)}</strong> ${esc(g.text)}</div>`).join("")||"<p style='color:var(--muted)'>None yet</p>"}</div>
    <p style="color:var(--muted);font-size:14px">Opposing team and the actor see the word. Saying it is challengeable. Party leader makes the final call.</p></aside></div>
    ${st.phase==="challenge"?challengeHTML(st):""}`;
}
function challengeHTML(st){
  const c=st.challenge||{votes:[]}; const up=c.votes.filter(v=>v.vote==="uphold").length; const down=c.votes.filter(v=>v.vote==="dismiss").length; const m=me(st);
  return `<div class="modal-back"><div class="modal"><h2>Challenge</h2><p>${esc(c.byName)}: ${esc(c.reason)}</p><p>Word was <strong>${esc(st.turn.word)}</strong></p><p>Uphold ${up} · Dismiss ${down}</p>
  ${m&&!c.votes.find(v=>v.id===m.id)?'<div class="row"><button class="btn danger" id="voteUp">Uphold</button><button class="btn ghost" id="voteDown">Dismiss</button></div>':"<p>Vote in.</p>"}
  ${leader(st)?'<div class="row" style="margin-top:8px"><button class="btn" data-rule="no-point">No point</button><button class="btn teal" data-rule="award">Award</button><button class="btn" data-rule="steal">Steal</button><button class="btn danger" data-rule="penalty">−1</button></div>':"<p>Waiting on the party leader.</p>"}</div></div>`;
}
function bindGate(){
  document.getElementById("create").onclick=()=>{ const name=document.getElementById("name").value.trim(); if(!name) return err("Name yourself first."); saved("mp-name",name); const code=Math.random().toString(36).slice(2,7).toUpperCase(); openRoom(code,"host",""); };
  document.getElementById("join").onclick=()=>{ const name=document.getElementById("name").value.trim(); const code=document.getElementById("code").value.trim().toUpperCase(); if(!name||code.length<4) return err("Name and a room code."); saved("mp-name",name); openRoom(code,"guest",document.getElementById("team").value); };
}
function bindBoard(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ S.mode=b.dataset.mode; render(); });
  document.getElementById("start")&&(document.getElementById("start").onclick=()=>act("start"));
  document.getElementById("next")&&(document.getElementById("next").onclick=()=>act("next"));
  document.getElementById("sendGuess")&&(document.getElementById("sendGuess").onclick=()=>{ const t=document.getElementById("guess").value.trim(); if(t) act("guess",{text:t}); });
  document.getElementById("correct")&&(document.getElementById("correct").onclick=()=>act("correct"));
  document.getElementById("skip")&&(document.getElementById("skip").onclick=()=>act("skip"));
  document.getElementById("challenge")&&(document.getElementById("challenge").onclick=()=>act("challenge",{reason:prompt("Why challenge?","Said the word")||"Said the word"}));
  document.getElementById("voteUp")&&(document.getElementById("voteUp").onclick=()=>act("vote",{vote:"uphold"}));
  document.getElementById("voteDown")&&(document.getElementById("voteDown").onclick=()=>act("vote",{vote:"dismiss"}));
  document.querySelectorAll("[data-rule]").forEach(b=>b.onclick=()=>act("rule",{rule:b.dataset.rule}));
  document.getElementById("clearPad")&&(document.getElementById("clearPad").onclick=()=>act("clear"));
  document.getElementById("leave")&&(document.getElementById("leave").onclick=()=>location.reload());
  const pad=document.getElementById("pad"); if(pad&&me(S.state)?.id===S.state.turn?.actorId) bindPad(pad);
  cam();
}
function fresh(){ return { phase:"lobby", players:[], scores:{A:0,B:0}, turn:null, guesses:[], strokes:[], challenge:null, banner:"Room open", queue:[], link:location.href }; }
function openRoom(code, role, teamPref){
  if(typeof mqtt==="undefined") return err("Live library failed to load. Check the network and refresh.");
  S.role=role; S.room=code; saved("mp-room",code); err("Opening "+code+"…");
  if(role==="host"){ S.state=fresh(); S.state.players.push({id:ME,name:saved("mp-name"),team:"A",connected:true,leader:true,seen:Date.now()}); render(); }
  let i=0;
  const tryBroker=()=>{
    const url=BROKERS[i%BROKERS.length];
    if(S.mq){ try{S.mq.end(true);}catch(e){} }
    const mq=mqtt.connect(url,{clientId:"mp"+ME.slice(0,8)+Math.random().toString(16).slice(2,6),clean:true,reconnectPeriod:2000,connectTimeout:8000});
    S.mq=mq;
    const fail=setTimeout(()=>{ if(!S.linked){ i++; err("Broker slow, trying another…"); tryBroker(); } },9000);
    mq.on("connect",()=>{
      clearTimeout(fail); S.linked=true;
      mq.subscribe("mime/"+code+"/in"); mq.subscribe("mime/"+code+"/state");
      if(role==="guest") publish("in",{t:"hello",name:saved("mp-name"),teamPref});
      else publishState();
      err("");
    });
    mq.on("message",(topic,buf)=>{
      let msg; try{ msg=JSON.parse(buf.toString()); }catch(e){ return; }
      if(topic.endsWith("/state")&&role==="guest"&&msg.room===code){ S.state=msg.state; render(); }
      if(topic.endsWith("/in")&&role==="host") onIn(msg);
    });
    mq.on("error",()=>{ err("Could not reach a live broker. Retrying…"); });
  };
  tryBroker();
}
function publish(kind,msg){ if(!S.mq||!S.mq.connected) return; msg.playerId=ME; msg.room=S.room; S.mq.publish("mime/"+S.room+"/"+kind, JSON.stringify(msg)); }
function publishState(){ if(S.role!=="host"||!S.state) return; S.state.players.forEach(p=>{ if(p.id!==ME && Date.now()-(p.seen||0)>12000) p.connected=false; }); publish("state",{state:S.state}); render(); }
function act(t, extra){ const msg=Object.assign({t}, extra||{}); if(S.role==="host") onIn(Object.assign(msg,{playerId:ME,name:saved("mp-name")})); else publish("in",msg); }
function onIn(msg){
  if(S.role!=="host") return;
  const st=S.state; if(!st) return;
  if(msg.t==="hello"){
    let p=st.players.find(x=>x.id===msg.playerId);
    if(!p){ if(st.players.length>=MAX_PLAYERS) return; const a=st.players.filter(x=>x.team==="A").length; p={id:msg.playerId,name:String(msg.name||"Player").slice(0,22),team:msg.teamPref||(a<=st.players.length-a?"A":"B"),connected:true,leader:false}; st.players.push(p); st.banner=p.name+" joined"; }
    else { p.connected=true; p.name=String(msg.name||p.name).slice(0,22); st.banner=p.name+" reconnected"; }
    p.seen=Date.now(); publishState(); return;
  }
  const p=st.players.find(x=>x.id===msg.playerId); if(!p) return; p.seen=Date.now(); p.connected=true;
  if(msg.t==="ping") return publishState();
  if(msg.t==="guess"&&st.phase==="play"&&p.team===st.turn.team&&p.id!==st.turn.actorId) st.guesses.push({name:p.name,text:String(msg.text).slice(0,80)});
  if(msg.t==="stroke"&&p.id===st.turn?.actorId) st.strokes.push(msg.stroke);
  if(msg.t==="clear"&&p.id===st.turn?.actorId) st.strokes=[];
  if(msg.t==="start"&&p.leader) return startRound();
  if(msg.t==="next"&&p.leader) return nextTurn();
  if(msg.t==="correct"&&st.phase==="play"&&(p.id===st.turn.actorId||p.leader)) return award();
  if(msg.t==="skip"&&st.phase==="play"&&(p.id===st.turn.actorId||p.leader)) return endTurn("Skipped");
  if(msg.t==="challenge"&&st.phase==="play"){ st.phase="challenge"; st.challenge={byName:p.name,reason:msg.reason,votes:[]}; st.banner="Challenge"; }
  if(msg.t==="vote"&&st.phase==="challenge") st.challenge.votes=st.challenge.votes.filter(v=>v.id!==p.id).concat([{id:p.id,vote:msg.vote}]);
  if(msg.t==="rule"&&p.leader&&st.turn){ const team=st.turn.team, other=team==="A"?"B":"A"; if(msg.rule==="award") st.scores[team]++; if(msg.rule==="steal") st.scores[other]++; if(msg.rule==="penalty") st.scores[team]--; return endTurn("Leader ruled: "+msg.rule); }
  publishState();
}
function startRound(){ S.state.queue=S.state.players.filter(p=>p.connected).map(p=>p.id); S.state.phase="between"; nextTurn(); }
function nextTurn(){
  const st=S.state; if(!st.queue.length) st.queue=st.players.filter(p=>p.connected).map(p=>p.id);
  const actorId=st.queue.shift(); const actor=st.players.find(p=>p.id===actorId); if(!actor) return nextTurn();
  const cats=Object.keys(WORDS); const category=cats[Math.floor(Math.random()*cats.length)];
  const word=WORDS[category][Math.floor(Math.random()*WORDS[category].length)];
  st.turn={team:actor.team,actorId,mode:S.mode,word,category,endsAt:Date.now()+90000};
  st.guesses=[]; st.strokes=[]; st.challenge=null; st.phase="play"; st.banner=actor.name+" is up for Team "+actor.team; publishState();
}
function award(){ S.state.scores[S.state.turn.team]++; endTurn("Point to Team "+S.state.turn.team); }
function endTurn(msg){ S.state.phase="between"; S.state.banner=msg; S.state.challenge=null; publishState(); }
function bindPad(pad){
  const pos=e=>{ const r=pad.getBoundingClientRect(); const src=e.touches?e.touches[0]:e; return {x:(src.clientX-r.left)/r.width,y:(src.clientY-r.top)/r.height}; };
  pad.onpointerdown=e=>{ S.drawing=true; S.stroke={color:S.color,pts:[pos(e)]}; };
  pad.onpointermove=e=>{ if(!S.drawing) return; S.stroke.pts.push(pos(e)); paint(); };
  pad.onpointerup=()=>{ if(!S.drawing) return; S.drawing=false; act("stroke",{stroke:S.stroke}); };
}
function paint(){ const pad=document.getElementById("pad"); if(!pad||!S.state) return; const ctx=pad.getContext("2d"); ctx.fillStyle="#f7f1e6"; ctx.fillRect(0,0,pad.width,pad.height); (S.state.strokes||[]).forEach(s=>draw(ctx,s)); if(S.drawing) draw(ctx,S.stroke); }
function draw(ctx,s){ if(!s?.pts?.length) return; ctx.strokeStyle=s.color; ctx.lineWidth=4; ctx.lineCap="round"; ctx.beginPath(); s.pts.forEach((p,i)=>{ const x=p.x*ctx.canvas.width,y=p.y*ctx.canvas.height; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); }
async function cam(){ const v=document.getElementById("stageVideo"); if(!v||!S.state?.turn) return; if(me(S.state)?.id!==S.state.turn.actorId) return; try { const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); v.srcObject=stream; } catch(e){} }
setInterval(()=>{ const t=document.getElementById("timer"); if(t&&S.state?.turn&&S.state.phase==="play"){ const left=Math.max(0,Math.ceil((S.state.turn.endsAt-Date.now())/1000)); t.textContent=left; if(S.role==="host"&&left===0) endTurn("Time"); } if(S.role==="guest"&&S.mq?.connected) publish("in",{t:"ping",name:saved("mp-name")}); if(S.role==="host") publishState(); },1000);
window.addEventListener("error",e=>{ err(e.message||"Script error"); });
render();
</script>
</body>
</html>
